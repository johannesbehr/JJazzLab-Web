name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "player/**"
      - "diagnostics/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install player dependencies
        working-directory: player
        run: npm install

      - name: Build player
        working-directory: player
        run: npm run build

      - name: Include diagnostics page
        run: |
          mkdir -p site/diagnostics
          cp diagnostics/index.html diagnostics/styles.css diagnostics/diagnostics.js site/diagnostics/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
